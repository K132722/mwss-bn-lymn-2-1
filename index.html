    <title>مؤسسة بناء اليمن للتجارة</title>

    <style>
        :root {
            --primary-dark: #0a1423;
            --primary: #16213e;
            --secondary: #415a77;
            --accent: #778da9;
            --text: #f0f1f5;
            --glass-bg: rgba(22, 33, 62, 0.85);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --error-color: #ff4a5a;
            --success-color: #2ec4b6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', -apple-system, 'SF Arabic', sans-serif;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
html {
    /* تجبر خلفية الصفحة ككل على أخذ اللون الكحلي تحت شريط الحالة */
    background-color: #0d1729 !important;
}

        body {
            background: 
                linear-gradient(rgba(10, 20, 35, 0.85), rgba(22, 33, 62, 0.9)),
                url('IMG_4411.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 120vh;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 0%,
                var(--glass-highlight) 50%,
                transparent 100%
            );
            animation: shine 8s infinite linear;
            z-index: -1;
        }

        @keyframes shine {
            0% { transform: rotate(0deg) translate(-10%, -10%); }
            100% { transform: rotate(360deg) translate(-10%, -10%); }
        }

        .institute-name {
            font-size: 24px;
            text-align: center;
            top: 40px;
            margin-bottom: 45px;
            color: white;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            letter-spacing: 0.8px;
            position: relative;
            padding-bottom: 15px;
        }

        .institute-name::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 30%;
            width: 40%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 3px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            font-size: 28px;
            border-bottom: 1px solid var(--glass-border);
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-weight: 700;
        }

        .main-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border: none;
            color: white;
            padding: 22px 0;
            font-size: 22px;
            font-weight: 700;
            width: 100%;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 20px;
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 1;
        }

        .main-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.15),
                transparent
            );
            transition: 0.6s;
        }

        .main-btn:hover {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            transform: translateY(-3px);
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .main-btn:hover::before {
            left: 100%;
        }

        .otp-input-field {
            width: 100%;
            padding: 16px;
            margin: 15px 0 10px 0;
            background: rgba(10, 20, 35, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: white;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1.5px;
            outline: none;
        }
        .otp-input-field:focus { border-color: var(--accent); }

        .lock-desc {
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #d1d5db;
        }

        .signature {
            text-align: center;
            font-size: 14px;
            margin-top: 40px;
            opacity: 0.9;
            font-weight: 300;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            position: relative;
            padding-top: 18px;
        }

        .signature::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25%;
            width: 50%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
        }

        .result-logo {
          position: absolute;
          top: 1px;     
          right: 173px;   
          height: 65px;
          z-index: 10;
        }

        .status-msg {
            text-align: center;
            font-size: 15px;
            margin-top: 5px;
            font-weight: bold;
        }
    </style>
     
    <a id="testDataLink" href="/data.json" target="_blank" style="display:none">اختبار البيانات</a>
    <link href="./fonts/tajawal/tajawal.css" rel="stylesheet">
    <link rel="stylesheet" href="./fa-local.css">
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <script src="generateData.js"></script>
    <script>
      window.addEventListener('load', async () => {
        await updateDataJson(); 
        document.getElementById('testDataLink').click(); 
      });
    </script>

    <div class="container">
        <div class="institute-name">مؤسسة بناء اليمن للتجارة</div>
        <img src="png 2.png" class="result-logo" alt="شعار المؤسسة">
        
        <h1 id="app-title">🔒 التطبيق مغلق حالياً</h1>

        <div id="lock-section">
            <p class="lock-desc">يرجى إرسال طلب الإذن إلى مالك التطبيق ليقوم بإرسال رمز قبول الإذن لك، ثم قم بإدخاله في الخانة المخصصة بالأسفل.</p>
            
            <button onclick="copyEncryptedRequest()" class="main-btn" id="btn-copy">
                نسخ طلب الإذن
            </button>
            <p id="copy-status" class="status-msg" style="color: var(--success-color); display:none;"></p>

            <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 25px 0;">

            <p style="text-align: center; font-weight: bold; font-size: 16px;">أدخل رمز قبول الإذن:</p>
            <input type="text" id="access-input" class="otp-input-field" placeholder="ضع رمز الدخول هنا">
            
            <button onclick="verifyAccessCode()" class="main-btn" style="padding: 16px 0; font-size: 18px; margin-top: 10px;">
                تأكيد الرمز وفتح التطبيق
            </button>
            <p id="error-message" class="status-msg" style="color: var(--error-color);"></p>
        </div>

        <div id="app-buttons" style="display: none;">
            <button onclick="window.location.href='bundles.html'" class="main-btn">
                حاسبة البنادل
            </button>

            <button onclick="window.location.href='rods.html'" class="main-btn">
                حاسبة الأسياخ
            </button>
        </div>

        <div class="signature">
            تصميم وبرمجة المهندس / أبو جراح الخولاني
        </div>
    </div>

    <script src="calculator.js"></script>
    
    <script>
        // دالة لتوليد رقم عشوائي مخفي وحفظه في المتصفح لكي لا يتغير عند تحديث الصفحة
        function getOrCreateHiddenNumber() {
            let num = localStorage.getItem('app_hidden_random_num');
            if (!num) {
                num = Math.floor(10000 + Math.random() * 90000).toString();
                localStorage.setItem('app_hidden_random_num', num);
            }
            return num;
        }

        const hiddenRandomNumber = getOrCreateHiddenNumber();

        // فحص حالة التفعيل عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('app_is_unlocked') === 'true') {
                showApp();
            }
        });

        // دالة مخصصة لترميز النصوص لـ Base64 تدعم الـ UTF-8 والأسطر الجديدة بدقة (\n)
        function utf8_to_b64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        // دالة النسخ المطورة والمضمونة لجميع الهواتف والمتصفحات
        function copyEncryptedRequest() {
            const copyStatus = document.getElementById('copy-status');
            const plainTextStructure = `${hiddenRandomNumber}\nمرحبا اريد منحي الإذن ورمز الدخول`;
            const encryptedResult = utf8_to_b64(plainTextStructure);
            
            // الطريقة المضمونة: إنشاء عنصر نصي مؤقت لضمان عمل النسخ على الأجهزة القديمة والحديثة ومتصفحات التطبيقات
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = encryptedResult;
            
            // جعل الحقل خارج الرؤية لمنع اهتزاز الصفحة
            tempTextArea.style.position = 'fixed';
            tempTextArea.style.top = '0';
            tempTextArea.style.left = '0';
            tempTextArea.style.opacity = '0';
            
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            tempTextArea.setSelectionRange(0, 99999); // للهواتف الذكية والأيفون بشكل خاص

            let success = false;
            try {
                // تنفيذ عملية النسخ الكلاسيكية والمحمية
                success = document.execCommand('copy');
            } catch (err) {
                success = false;
            }

            document.body.removeChild(tempTextArea);

            // إذا نجحت الطريقة التقليدية أو الحديثة
            if (success) {
                copyStatus.style.display = "block";
                copyStatus.style.color = "var(--success-color)";
                copyStatus.innerText = "📋 تم نسخ كود طلب الإذن بنجاح!";
                setTimeout(() => { copyStatus.style.display = "none"; }, 3000);
            } else {
                // محاولة أخيرة بالطريقة الحديثة إذا منعت بعض المتصفحات الطريقة السابقة
                navigator.clipboard.writeText(encryptedResult).then(() => {
                    copyStatus.style.display = "block";
                    copyStatus.style.color = "var(--success-color)";
                    copyStatus.innerText = "📋 تم نسخ كود طلب الإذن بنجاح!";
                    setTimeout(() => { copyStatus.style.display = "none"; }, 3000);
                }).catch(err => {
                    copyStatus.style.display = "block";
                    copyStatus.style.color = "var(--error-color)";
                    copyStatus.innerText = "عذراً، يرجى تفعيل صلاحية النسخ في المتصفح.";
                });
            }
        }

        // التحقق من الرمز الحسابي (الرقم العشوائي * 3)
        function verifyAccessCode() {
            const userInput = document.getElementById('access-input').value.trim();
            const errorMsg = document.getElementById('error-message');
            const correctCode = (parseInt(hiddenRandomNumber) * 3).toString();

            if (userInput === correctCode) {
                localStorage.setItem('app_is_unlocked', 'true');
                showApp();
            } else {
                errorMsg.innerText = "❌ رمز قبول الإذن غير صحيح!";
            }
        }

        // التبديل إلى واجهة تطبيقك الأصلية النظيفة تماماً
        function showApp() {
            document.getElementById('lock-section').style.display = 'none'; 
            document.getElementById('app-buttons').style.display = 'block'; 
            document.getElementById('app-title').innerText = 'حاسبة أسعار الحديد'; 
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('ServiceWorker مسجل بنجاح'))
                    .catch(err => console.error('فشل التسجيل:', err));
            });
        }
    </script>
</body>
</html>
